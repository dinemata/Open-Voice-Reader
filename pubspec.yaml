name: free_voice_reader
description: "Free voice reader."

publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sherpa_onnx: ^1.13.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/cs_CZ-jirka-medium.onnx
    - assets/models/cs_CZ-jirka-medium.onnx.json
    - assets/models/kokoro-v1.0.onnx
    - assets/models/voices-v1.0.bin
    - assets/models/tokens.txt