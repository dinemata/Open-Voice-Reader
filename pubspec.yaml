name: open_voice_reader
description: "Open Voice Reader."
publish_to: 'none'
version: 0.1.9+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sherpa_onnx: ^1.13.0
  path_provider: ^2.1.5
  audioplayers: ^5.2.1
  file_picker: ^11.0.2
  scrollable_positioned_list: ^0.3.8
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.1
  audio_service: ^0.18.18
  flutter_pdfview: ^1.4.4
  syncfusion_flutter_pdf: ^33.2.7
  syncfusion_flutter_pdfviewer: ^33.2.7
  path: ^1.9.0
  shared_preferences: ^2.5.5
  pdfx: ^2.9.2
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/fg.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/fg.png
    - assets/models/vits-piper-cs_CZ-jirka-medium/cs_CZ-jirka-medium.onnx
    - assets/models/vits-piper-cs_CZ-jirka-medium/cs_CZ-jirka-medium.onnx.json
    - assets/models/vits-piper-cs_CZ-jirka-medium/tokens.txt
    - assets/models/vits-piper-cs_CZ-jirka-medium/espeak-ng-data/cs_dict

    - assets/models/kokoro-en-v0_19/model.onnx
    - assets/models/kokoro-en-v0_19/voices.bin
    - assets/models/kokoro-en-v0_19/tokens.txt
    - assets/models/kokoro-en-v0_19/espeak-ng-data/phontab
    - assets/models/kokoro-en-v0_19/espeak-ng-data/phondata
    - assets/models/kokoro-en-v0_19/espeak-ng-data/phondata-manifest
    - assets/models/kokoro-en-v0_19/espeak-ng-data/phonindex
    - assets/models/kokoro-en-v0_19/espeak-ng-data/intonations
    - assets/models/kokoro-en-v0_19/espeak-ng-data/en_dict
    - assets/models/kokoro-en-v0_19/espeak-ng-data/lang/gmw/en
    - assets/models/kokoro-en-v0_19/espeak-ng-data/lang/gmw/en-US

    - assets/models/vits-piper-en_GB-alan-medium/en_GB-alan-medium.onnx
    - assets/models/vits-piper-en_GB-alan-medium/en_GB-alan-medium.onnx.json
    - assets/models/vits-piper-en_GB-alan-medium/tokens.txt

    # absence caused abort() popup
    - assets/models/vits-piper-en_GB-alan-medium/espeak-ng-data/lang/gmw/en-GB-x-rp
